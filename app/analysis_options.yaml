include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/models/contracts.dart   # generated from contracts/schemas by tool/gen_models.py

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
