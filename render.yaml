# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the API. The repo root is the service root so api/ can read ../contracts.
services:
  - type: web
    name: arth-api
    runtime: node
    plan: starter            # free tier sleeps after 15 min idle; starter stays warm (matters for the LRU cache)
    region: singapore        # closest to India; put the Atlas cluster in ap-south-1 (Mumbai) or ap-southeast-1
    buildCommand: cd api && npm ci && npm run build
    startCommand: cd api && npm start
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false          # set in the dashboard: mongodb+srv://…/arth
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_CONTEXT_MODEL
        value: gpt-5.6-luna
      - key: LLM_TRANSLATE_MODEL
        value: gpt-5.6-luna
      - key: LLM_CONTEXT_INDEX_MODEL
        value: gpt-5.6-luna
      - key: CONTEXT_MODE
        value: live
      - key: RATE_LIMIT_LOOKUPS
        value: "60"
      - key: RATE_LIMIT_LLM
        value: "20"
      - key: RATE_LIMIT_PREFETCH
        value: "40"
      - key: SEED_LIMIT
        value: "20000"
      - key: FIREBASE_PROJECT_ID
        sync: false          # accounts: the Firebase project whose ID tokens are accepted
      - key: CLOUDINARY_URL
        sync: false          # profile photos: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: REVENUECAT_SECRET_KEY
        sync: false          # RevenueCat secret key (sk_…), reads buyers' entitlements
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false          # the Authorization header value set on RevenueCat's webhook
      - key: AI_FREE_LIMIT
        value: "100"
      - key: AI_PRO_MONTHLY
        value: "500"
      - key: AI_SUPER_MONTHLY
        value: "5000"
      - key: AI_FREE_ACCOUNTS_PER_DEVICE
        value: "3"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false          # push notifications: the service-account key JSON (or base64 of it)

  # Review reminders: once a day, 18:30 IST (13:00 UTC), when readers wind down.
  - type: cron
    name: arth-review-reminders
    runtime: node
    region: singapore
    schedule: "0 13 * * *"
    buildCommand: cd api && npm ci
    startCommand: cd api && npm run review-reminders
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
